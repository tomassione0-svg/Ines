<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f0a1e">
<title>Nuestras Citas</title>
<link rel="apple-touch-icon" href="icon-citas.png">
<link rel="manifest" href="manifest-citas.json">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg-deep: #0f0a1e;
  --bg-card: rgba(255,255,255,0.06);
  --bg-card-hover: rgba(255,255,255,0.1);
  --accent: #e8a0bf;
  --accent-bright: #f472b6;
  --accent-soft: #fce4ec;
  --gold: #e8b87c;
  --text: #f5f0ff;
  --text-muted: rgba(245,240,255,0.55);
  --glass: rgba(255,255,255,0.08);
  --glass-border: rgba(255,255,255,0.12);
  --radius: 16px;
  --shadow: 0 8px 32px rgba(0,0,0,0.3);
  --gradient-main: linear-gradient(135deg, #e8a0bf 0%, #d4788c 50%, #c06080 100%);
  --gradient-gold: linear-gradient(135deg, #e8b87c 0%, #d4a06c 100%);
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html { scroll-behavior: smooth; }

body {
  font-family: 'Poppins', sans-serif;
  background: var(--bg-deep);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  padding-bottom: 100px;
}

/* ── Fondo animado con partículas ── */
.bg-particles {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 0; overflow: hidden;
}
.bg-particles .orb {
  position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.3;
  animation: floatOrb 20s ease-in-out infinite alternate;
}
.bg-particles .orb:nth-child(1) {
  width: 300px; height: 300px; background: #e8a0bf; top: -100px; left: -50px;
}
.bg-particles .orb:nth-child(2) {
  width: 250px; height: 250px; background: #7c5cbf; bottom: -80px; right: -60px;
  animation-delay: -7s;
}
.bg-particles .orb:nth-child(3) {
  width: 200px; height: 200px; background: #d4788c; top: 40%; left: 60%;
  animation-delay: -14s;
}
@keyframes floatOrb {
  0% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(40px, -30px) scale(1.1); }
  100% { transform: translate(-20px, 20px) scale(0.95); }
}

/* ── Corazones flotantes ── */
.floating-hearts {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 1; overflow: hidden;
}
.heart-particle {
  position: absolute; font-size: 14px; opacity: 0;
  animation: floatHeart linear infinite;
}
@keyframes floatHeart {
  0% { opacity: 0; transform: translateY(100vh) rotate(0deg) scale(0.5); }
  10% { opacity: 0.6; }
  90% { opacity: 0.3; }
  100% { opacity: 0; transform: translateY(-10vh) rotate(360deg) scale(1.2); }
}

/* ── Contenedor principal ── */
.container {
  position: relative; z-index: 2;
  max-width: 480px; margin: 0 auto; padding: 0 16px;
}

/* ── Header ── */
.header {
  text-align: center; padding: 50px 0 30px;
}
.header-icon {
  font-size: 48px; margin-bottom: 8px;
  animation: heartBeat 1.5s ease-in-out infinite;
}
@keyframes heartBeat {
  0%, 100% { transform: scale(1); }
  15% { transform: scale(1.15); }
  30% { transform: scale(1); }
  45% { transform: scale(1.1); }
}
.header h1 {
  font-family: 'Playfair Display', serif;
  font-size: 32px; font-weight: 700;
  background: var(--gradient-main);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.header p {
  font-size: 13px; color: var(--text-muted); margin-top: 4px;
  font-style: italic;
}

/* ── Frase del día ── */
.quote-card {
  background: var(--bg-card);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius); padding: 24px 20px;
  margin-bottom: 24px; text-align: center;
  position: relative; overflow: hidden;
}
.quote-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: var(--gradient-main);
}
.quote-label {
  font-size: 10px; text-transform: uppercase; letter-spacing: 2px;
  color: var(--accent); margin-bottom: 12px; font-weight: 500;
}
.quote-text {
  font-family: 'Playfair Display', serif;
  font-size: 18px; font-style: italic; line-height: 1.5;
  color: var(--accent-soft);
}
.quote-icon {
  font-size: 24px; margin-top: 12px; opacity: 0.5;
}

/* ── Secciones ── */
.section { margin-bottom: 24px; }
.section-title {
  font-size: 14px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 1.5px; color: var(--accent);
  margin-bottom: 12px; padding-left: 4px;
  display: flex; align-items: center; gap: 8px;
}
.section-title span { font-size: 16px; }

/* ── Calendario ── */
.calendar-card {
  background: var(--bg-card);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius); padding: 20px;
  box-shadow: var(--shadow);
}
.cal-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 16px;
}
.cal-header h3 {
  font-family: 'Playfair Display', serif;
  font-size: 18px; font-weight: 400;
}
.cal-nav {
  display: flex; gap: 8px;
}
.cal-nav button {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--glass); border: 1px solid var(--glass-border);
  color: var(--text); font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
.cal-nav button:active { transform: scale(0.92); background: var(--bg-card-hover); }
.cal-weekdays {
  display: grid; grid-template-columns: repeat(7, 1fr);
  margin-bottom: 8px;
}
.cal-weekdays span {
  text-align: center; font-size: 11px; font-weight: 500;
  color: var(--text-muted); padding: 4px 0;
}
.cal-days {
  display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px;
}
.cal-day {
  aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
  border-radius: 12px; font-size: 14px; cursor: pointer;
  transition: all 0.2s; position: relative;
  background: transparent; border: none; color: var(--text);
  font-family: 'Poppins', sans-serif;
}
.cal-day:hover { background: var(--glass); }
.cal-day.today {
  border: 1px solid var(--accent); color: var(--accent); font-weight: 600;
}
.cal-day.selected {
  background: var(--gradient-main); color: white; font-weight: 600;
  box-shadow: 0 4px 15px rgba(232,160,191,0.4);
}
.cal-day.has-event::after {
  content: ''; position: absolute; bottom: 4px;
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--accent-bright);
}
.cal-day.other-month { opacity: 0.25; }
.cal-day.past { opacity: 0.4; }

.selected-date-display {
  margin-top: 16px; padding: 12px 16px;
  background: rgba(232,160,191,0.1); border-radius: 12px;
  border: 1px solid rgba(232,160,191,0.2);
  text-align: center; font-size: 14px;
  display: none;
}
.selected-date-display.show { display: block; }
.selected-date-display .date-text {
  font-family: 'Playfair Display', serif;
  font-size: 16px; color: var(--accent-soft);
}

/* ── Categorías de lugares ── */
.categories-grid {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
}
.category-btn {
  background: var(--bg-card);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius); padding: 16px 12px;
  text-align: center; cursor: pointer;
  transition: all 0.3s; text-decoration: none; color: var(--text);
  display: flex; flex-direction: column; align-items: center; gap: 6px;
}
.category-btn:active {
  transform: scale(0.96); background: var(--bg-card-hover);
  border-color: var(--accent);
}
.category-btn .cat-icon { font-size: 28px; }
.category-btn .cat-name { font-size: 13px; font-weight: 500; }
.category-btn .cat-desc { font-size: 10px; color: var(--text-muted); }

/* ── Modal de lugar personalizado ── */
.modal-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
  z-index: 100; display: none; align-items: flex-end; justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal-content {
  background: #1a1230; border-radius: 20px 20px 0 0;
  width: 100%; max-width: 480px; padding: 24px 20px 40px;
  animation: slideUp 0.3s ease;
  max-height: 85vh; overflow-y: auto;
}
@keyframes slideUp {
  from { transform: translateY(100%); } to { transform: translateY(0); }
}
.modal-handle {
  width: 40px; height: 4px; background: rgba(255,255,255,0.2);
  border-radius: 2px; margin: 0 auto 20px;
}
.modal-title {
  font-family: 'Playfair Display', serif;
  font-size: 20px; margin-bottom: 16px; text-align: center;
}
.modal-input {
  width: 100%; padding: 14px 16px; border-radius: 12px;
  background: var(--glass); border: 1px solid var(--glass-border);
  color: var(--text); font-size: 15px; font-family: 'Poppins', sans-serif;
  margin-bottom: 12px; outline: none;
  transition: border-color 0.2s;
}
.modal-input:focus { border-color: var(--accent); }
.modal-input::placeholder { color: var(--text-muted); }
textarea.modal-input { min-height: 80px; resize: none; }
.modal-search-results {
  margin-bottom: 16px; max-height: 200px; overflow-y: auto;
}
.search-result-item {
  padding: 12px 14px; background: var(--glass); border-radius: 10px;
  margin-bottom: 6px; cursor: pointer; transition: all 0.2s;
  border: 1px solid transparent;
}
.search-result-item:active { border-color: var(--accent); background: var(--bg-card-hover); }
.search-result-item .place-name { font-size: 14px; font-weight: 500; }
.search-result-item .place-info { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.modal-actions {
  display: flex; gap: 10px; margin-top: 8px;
}
.btn {
  flex: 1; padding: 14px; border-radius: 12px;
  font-size: 14px; font-weight: 600; cursor: pointer;
  border: none; font-family: 'Poppins', sans-serif;
  transition: all 0.2s;
}
.btn:active { transform: scale(0.97); }
.btn-primary {
  background: var(--gradient-main); color: white;
  box-shadow: 0 4px 15px rgba(232,160,191,0.3);
}
.btn-secondary {
  background: var(--glass); color: var(--text);
  border: 1px solid var(--glass-border);
}
.btn-danger {
  background: rgba(239,68,68,0.15); color: #f87171;
  border: 1px solid rgba(239,68,68,0.3);
}
.btn-whatsapp {
  background: #25d366; color: white;
  box-shadow: 0 4px 15px rgba(37,211,102,0.3);
}
.btn-icon { display: flex; align-items: center; justify-content: center; gap: 6px; }

/* ── Citas guardadas ── */
.saved-dates { display: flex; flex-direction: column; gap: 10px; }
.date-card {
  background: var(--bg-card);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius); padding: 16px;
  position: relative; overflow: hidden;
}
.date-card::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
  background: var(--gradient-main);
}
.date-card-header {
  display: flex; justify-content: space-between; align-items: flex-start;
}
.date-card-info h4 {
  font-family: 'Playfair Display', serif;
  font-size: 16px; margin-bottom: 2px;
}
.date-card-info .date-place {
  font-size: 13px; color: var(--accent); display: flex; align-items: center; gap: 4px;
}
.date-card-info .date-notes {
  font-size: 12px; color: var(--text-muted); margin-top: 6px;
}
.date-card-info .date-category {
  font-size: 11px; color: var(--text-muted); margin-top: 4px;
  display: flex; align-items: center; gap: 4px;
}
.date-card-actions {
  display: flex; gap: 6px;
}
.date-card-actions button {
  width: 32px; height: 32px; border-radius: 8px;
  background: var(--glass); border: 1px solid var(--glass-border);
  color: var(--text-muted); font-size: 14px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
.date-card-actions button:active { transform: scale(0.9); }

.empty-state {
  text-align: center; padding: 30px 20px;
  color: var(--text-muted); font-size: 14px;
}
.empty-state .empty-icon { font-size: 40px; margin-bottom: 8px; opacity: 0.5; }

/* ── Acciones globales ── */
.global-actions {
  display: flex; gap: 10px; margin-top: 16px;
}

/* ── Toast ── */
.toast {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
  background: #1a1230; border: 1px solid var(--accent);
  color: var(--text); padding: 12px 24px; border-radius: 30px;
  font-size: 13px; z-index: 200; opacity: 0;
  transition: opacity 0.3s; pointer-events: none;
  box-shadow: 0 8px 30px rgba(0,0,0,0.5);
  white-space: nowrap;
}
.toast.show { opacity: 1; }

/* ── Búsqueda Google Maps dentro del modal ── */
.search-actions {
  display: flex; gap: 8px; margin-bottom: 12px;
}
.search-btn {
  flex: 1; padding: 10px; border-radius: 10px;
  background: rgba(66,133,244,0.15); border: 1px solid rgba(66,133,244,0.3);
  color: #93bbfc; font-size: 12px; font-weight: 500; cursor: pointer;
  font-family: 'Poppins', sans-serif;
  display: flex; align-items: center; justify-content: center; gap: 4px;
  transition: all 0.2s;
}
.search-btn:active { transform: scale(0.96); background: rgba(66,133,244,0.25); }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 4px; }

/* ── Animations ── */
.fade-in {
  animation: fadeIn 0.5s ease forwards;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<div class="bg-particles">

  { id: 'bar', icon: '🍷', name: 'Bares & Copas', desc: 'Cocktails y buena onda', query: 'bares+cocteles' },
  { id: 'restaurant', icon: '🍽️', name: 'Restaurantes', desc: 'Cenas románticas', query: 'restaurantes+romanticos' },
  { id: 'cafe', icon: '☕', name: 'Cafeterías', desc: 'Charla y café', query: 'cafeterias+lindas' },
  { id: 'cinema', icon: '🎬', name: 'Cine & Teatro', desc: 'Películas y shows', query: 'cine+teatro' },
  { id: 'outdoor', icon: '🌳', name: 'Aire Libre', desc: 'Parques y paseos', query: 'parques+paseos+al+aire+libre' },
  { id: 'entertainment', icon: '🎮', name: 'Entretenimiento', desc: 'Juegos y diversión', query: 'entretenimiento+boliche+escape+room' },
  { id: 'spa', icon: '💆', name: 'Spa & Relax', desc: 'Día de relajación', query: 'spa+masajes' },
  { id: 'culture', icon: '🎨', name: 'Arte & Cultura', desc: 'Museos y galerías', query: 'museos+galerias+arte' },
  { id: 'music', icon: '🎵', name: 'Música en Vivo', desc: 'Recitales y shows', query: 'musica+en+vivo+recitales' },
  { id: 'food', icon: '🍕', name: 'Street Food', desc: 'Ferias y foodtrucks', query: 'ferias+gastronomicas+food+trucks' },
];

const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const DIAS_SEMANA = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

// ══════════════════════════════════════════════
//  ESTADO
// ══════════════════════════════════════════════
let currentMonth = new Date().getMonth();
let currentYear = new Date().getFullYear();
let selectedDate = null;
let savedCitas = [];
const WA_NUMBER = '5491137581792';

function loadState() {
  try {
    savedCitas = JSON.parse(localStorage.getItem('citas_data') || '[]');
  } catch(e) { savedCitas = []; }
}

function saveState() {
  try {
    localStorage.setItem('citas_data', JSON.stringify(savedCitas));
  } catch(e) {}
}

// ══════════════════════════════════════════════
//  FRASE DEL DÍA
// ══════════════════════════════════════════════
function getDailyQuote() {
  const now = new Date();
  const start = new Date(now.getFullYear(), 0, 0);
  const diff = now - start;
  const oneDay = 1000 * 60 * 60 * 24;
  let dayOfYear = Math.floor(diff / oneDay);
  if (now.getHours() < 7) dayOfYear -= 1;
  if (dayOfYear < 0) dayOfYear = 0;
  return FRASES[dayOfYear % FRASES.length];
}

function updateQuote() {
  document.getElementById('dailyQuote').textContent = getDailyQuote();
}

// ══════════════════════════════════════════════
//  CALENDARIO
// ══════════════════════════════════════════════
function renderCalendar() {
  const monthNames = MESES;
  document.getElementById('calMonthYear').textContent = `${monthNames[currentMonth]} ${currentYear}`;

  const firstDay = new Date(currentYear, currentMonth, 1);
  const lastDay = new Date(currentYear, currentMonth + 1, 0);
  let startDay = firstDay.getDay() - 1;
  if (startDay < 0) startDay = 6;

  const today = new Date();
  today.setHours(0,0,0,0);

  const container = document.getElementById('calDays');
  container.innerHTML = '';

  const prevLast = new Date(currentYear, currentMonth, 0).getDate();
  for (let i = startDay - 1; i >= 0; i--) {
    const btn = document.createElement('button');
    btn.className = 'cal-day other-month';
    btn.textContent = prevLast - i;
    container.appendChild(btn);
  }

  const citaDates = savedCitas.map(c => c.date);

  for (let d = 1; d <= lastDay.getDate(); d++) {
    const btn = document.createElement('button');
    btn.className = 'cal-day';
    btn.textContent = d;
    const thisDate = new Date(currentYear, currentMonth, d);
    thisDate.setHours(0,0,0,0);
    const dateStr = formatDateISO(thisDate);

    if (thisDate < today) btn.classList.add('past');
    if (thisDate.getTime() === today.getTime()) btn.classList.add('today');
    if (citaDates.includes(dateStr)) btn.classList.add('has-event');
    if (selectedDate === dateStr) btn.classList.add('selected');

    if (thisDate >= today) {
      btn.onclick = () => selectDate(dateStr, thisDate);
    }
    container.appendChild(btn);
  }

  const totalCells = startDay + lastDay.getDate();
  const remaining = (7 - (totalCells % 7)) % 7;
  for (let i = 1; i <= remaining; i++) {
    const btn = document.createElement('button');
    btn.className = 'cal-day other-month';
    btn.textContent = i;
    container.appendChild(btn);
  }
}

function selectDate(dateStr, dateObj) {
  selectedDate = dateStr;
  renderCalendar();
  const display = document.getElementById('selectedDateDisplay');
  display.classList.add('show');
  const dayName = DIAS_SEMANA[dateObj.getDay()];
  const monthName = MESES[dateObj.getMonth()];
  document.getElementById('selectedDateText').textContent =
    `${capitalize(dayName)} ${dateObj.getDate()} de ${monthName}`;
}

function changeMonth(dir) {
  currentMonth += dir;
  if (currentMonth < 0) { currentMonth = 11; currentYear--; }
  if (currentMonth > 11) { currentMonth = 0; currentYear++; }
  renderCalendar();
}

// ══════════════════════════════════════════════
//  CATEGORÍAS
// ══════════════════════════════════════════════
function renderCategories() {
  const grid = document.getElementById('categoriesGrid');
  grid.innerHTML = CATEGORIAS.map(cat => `
    <div class="category-btn" onclick="openCategoryModal('${cat.id}')">
      <div class="cat-icon">${cat.icon}</div>
      <div class="cat-name">${cat.name}</div>
      <div class="cat-desc">${cat.desc}</div>
    </div>
  `).join('');
}

function openCategoryModal(catId) {
  if (!selectedDate) {
    showToast('Primero elegí una fecha en el calendario 📅');
    return;
  }

  const cat = CATEGORIAS.find(c => c.id === catId);
  const mapsUrl = `https://www.google.com/maps/search/${cat.query}`;

  const modal = document.getElementById('modal');
  document.getElementById('modalContent').innerHTML = `
    <div class="modal-handle"></div>
    <div class="modal-title">${cat.icon} ${cat.name}</div>

    <div class="search-actions">
      <button class="search-btn" onclick="useGeolocation('${cat.query}')">
        📍 Buscar cerca mío
      </button>
      <a href="${mapsUrl}" target="_blank" class="search-btn" style="text-decoration:none">
        🗺️ Buscar en Google Maps
      </a>
    </div>

    <p style="font-size:12px;color:var(--text-muted);margin-bottom:12px;text-align:center">
      Buscá en Maps, elegí el que te guste y escribilo acá:
    </p>

    <input type="text" class="modal-input" id="placeName" placeholder="Nombre del lugar">
    <input type="text" class="modal-input" id="placeAddress" placeholder="Dirección (opcional)">
    <textarea class="modal-input" id="placeNotes" placeholder="Notas o ideas para la cita..."></textarea>

    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveCita('${catId}')">💕 Guardar y enviar</button>
    </div>
  `;
  modal.classList.add('show');
}

function useGeolocation(query) {
  if (!navigator.geolocation) {
    showToast('Tu navegador no soporta geolocalización');
    return;
  }
  navigator.geolocation.getCurrentPosition(
    pos => {
      const url = `https://www.google.com/maps/search/${query}/@${pos.coords.latitude},${pos.coords.longitude},14z`;
      window.open(url, '_blank');
    },
    () => showToast('No se pudo obtener tu ubicación')
  );
}

// ══════════════════════════════════════════════
//  GUARDAR CITA
// ══════════════════════════════════════════════
function saveCita(catId) {
  const name = document.getElementById('placeName').value.trim();
  if (!name) { showToast('Escribí el nombre del lugar'); return; }

  const cat = CATEGORIAS.find(c => c.id === catId);
  const cita = {
    id: Date.now(),
    date: selectedDate,
    place: name,
    address: document.getElementById('placeAddress').value.trim(),
    notes: document.getElementById('placeNotes').value.trim(),
    category: cat.name,
    categoryIcon: cat.icon,
    createdAt: new Date().toISOString()
  };

  savedCitas.push(cita);
  saveState();
  closeModal();
  renderSavedDates();
  renderCalendar();
  showToast('¡Enviando a Tomi! 💕');
  setTimeout(() => shareCitaWA(cita.id), 500);
}

// ══════════════════════════════════════════════
//  MOSTRAR CITAS GUARDADAS
// ══════════════════════════════════════════════
function renderSavedDates() {
  const container = document.getElementById('savedDates');
  const actions = document.getElementById('globalActions');

  if (savedCitas.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">📍</div>
        <p>Todavía no hay citas planeadas</p>
        <p style="font-size:12px;margin-top:4px">Elegí una fecha, elegí el plan y se manda directo 💌</p>
      </div>
    `;
    actions.style.display = 'none';
    return;
  }

  actions.style.display = 'flex';
  const sorted = [...savedCitas].sort((a,b) => a.date.localeCompare(b.date));

  container.innerHTML = sorted.map(cita => {
    const d = parseDate(cita.date);
    const dayName = capitalize(DIAS_SEMANA[d.getDay()]);
    const dateStr = `${dayName} ${d.getDate()} de ${MESES[d.getMonth()]}`;
    return `
      <div class="date-card">
        <div class="date-card-header">
          <div class="date-card-info">
            <h4>${dateStr}</h4>
            <div class="date-place">${cita.categoryIcon} ${cita.place}</div>
            ${cita.address ? `<div class="date-category">📍 ${cita.address}</div>` : ''}
            ${cita.notes ? `<div class="date-notes">"${cita.notes}"</div>` : ''}
            <div class="date-category">🏷️ ${cita.category}</div>
          </div>
          <div class="date-card-actions">
            <button onclick="shareCitaWA(${cita.id})" title="Compartir">📱</button>
            <button onclick="deleteCita(${cita.id})" title="Eliminar">🗑️</button>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function deleteCita(id) {
  savedCitas = savedCitas.filter(c => c.id !== id);
  saveState();
  renderSavedDates();
  renderCalendar();
  showToast('Cita eliminada');
}

// ══════════════════════════════════════════════
//  COMPARTIR POR WHATSAPP
// ══════════════════════════════════════════════
function shareCitaWA(id) {
  const cita = savedCitas.find(c => c.id === id);
  if (!cita) return;
  const d = parseDate(cita.date);
  const dayName = capitalize(DIAS_SEMANA[d.getDay()]);
  const dateStr = `${dayName} ${d.getDate()} de ${MESES[d.getMonth()]}`;

  let msg = `💕 *¡Tenemos una cita!*\n\n`;
  msg += `📅 ${dateStr}\n`;
  msg += `${cita.categoryIcon} ${cita.place}\n`;
  if (cita.address) msg += `📍 ${cita.address}\n`;
  if (cita.notes) msg += `💬 ${cita.notes}\n`;
  msg += `\n❤️ Te amo`;

  window.open(`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank');
}

function shareAllWhatsApp() {
  if (savedCitas.length === 0) return;
  const sorted = [...savedCitas].sort((a,b) => a.date.localeCompare(b.date));

  let msg = `💕 *Nuestras próximas citas:*\n\n`;
  sorted.forEach(cita => {
    const d = parseDate(cita.date);
    const dayName = capitalize(DIAS_SEMANA[d.getDay()]);
    const dateStr = `${dayName} ${d.getDate()} de ${MESES[d.getMonth()]}`;
    msg += `📅 ${dateStr}\n`;
    msg += `${cita.categoryIcon} ${cita.place}\n`;
    if (cita.address) msg += `📍 ${cita.address}\n`;
    msg += `\n`;
  });
  msg += `❤️ Te amo`;

  window.open(`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank');
}

// ══════════════════════════════════════════════
//  EXPORTAR CSV (Excel)
// ══════════════════════════════════════════════
function exportCSV() {
  if (savedCitas.length === 0) { showToast('No hay citas para exportar'); return; }
  const sorted = [...savedCitas].sort((a,b) => a.date.localeCompare(b.date));

  let csv = '﻿'; // BOM for Excel
  csv += 'Fecha,Dia,Lugar,Direccion,Categoria,Notas\n';
  sorted.forEach(cita => {
    const d = parseDate(cita.date);
    const dayName = capitalize(DIAS_SEMANA[d.getDay()]);
    const dateStr = `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`;
    csv += `"${dateStr}","${dayName}","${esc(cita.place)}","${esc(cita.address)}","${esc(cita.category)}","${esc(cita.notes)}"\n`;
  });

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `nuestras_citas_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  showToast('¡Archivo descargado! 📊');
}


// ══════════════════════════════════════════════
//  UTILIDADES
// ══════════════════════════════════════════════
function formatDateISO(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function parseDate(s) {
  const [y,m,d] = s.split('-').map(Number);
  return new Date(y, m-1, d);
}
function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
function esc(s) { return (s||'').replace(/"/g, '""'); }

function closeModal() {
  document.getElementById('modal').classList.remove('show');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ══════════════════════════════════════════════
//  CORAZONES FLOTANTES
// ══════════════════════════════════════════════
function createHearts() {
  const container = document.getElementById('floatingHearts');
  const hearts = ['💕','💗','💖','✨','💫','🌸'];
  for (let i = 0; i < 15; i++) {
    const span = document.createElement('span');
    span.className = 'heart-particle';
    span.textContent = hearts[Math.floor(Math.random() * hearts.length)];
    span.style.left = Math.random() * 100 + '%';
    span.style.animationDuration = (12 + Math.random() * 18) + 's';
    span.style.animationDelay = (Math.random() * 20) + 's';
    span.style.fontSize = (10 + Math.random() * 10) + 'px';
    container.appendChild(span);
  }
}

// ══════════════════════════════════════════════
//  VERIFICAR NUEVA FRASE (cada minuto)
// ══════════════════════════════════════════════
let lastQuoteIndex = -1;
function checkQuoteUpdate() {
  const now = new Date();
  const start = new Date(now.getFullYear(), 0, 0);
  let dayOfYear = Math.floor((now - start) / 86400000);
  if (now.getHours() < 7) dayOfYear -= 1;
  if (dayOfYear < 0) dayOfYear = 0;
  const idx = dayOfYear % FRASES.length;
  if (idx !== lastQuoteIndex) {
    lastQuoteIndex = idx;
    updateQuote();
  }
}

// ══════════════════════════════════════════════
//  INICIALIZACIÓN
// ══════════════════════════════════════════════
loadState();
updateQuote();
renderCalendar();
renderCategories();
renderSavedDates();
createHearts();
setInterval(checkQuoteUpdate, 60000);
